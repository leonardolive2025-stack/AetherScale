name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o AetherScale-MVP.zip
          if [ -d AetherScale ]; then
            cp -r AetherScale/* .
            cp -r AetherScale/.[!.]* . 2>/dev/null || true
          fi
          chmod +x gradlew
          ls -la

      - name: Fix Compose for Kotlin 2.0
        run: |
          # Remove kotlinCompilerExtensionVersion que conflita com Kotlin 2.0
          sed -i '/kotlinCompilerExtensionVersion/d' app/build.gradle.kts
          sed -i '/composeOptions/,/}/d' app/build.gradle.kts
          # Remove propriedade deprecada
          sed -i '/android.defaults.buildfeatures.buildconfig/d' gradle.properties
          echo "=== app/build.gradle.kts (trecho) ==="
          grep -A5 -B5 "compose\|kotlin" app/build.gradle.kts || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherScale-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
